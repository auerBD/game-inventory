<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Game Inventory - Manage your items, equipment and loot">
  <title>Game Inventory</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/transitions.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Exo+2:wght@300;400;500;600&display=swap"
    rel="stylesheet">
</head>

<body>

  <!-- =============================================
         HEADER — Player info bar & main navigation
         ============================================= -->
  <header class="site-header">

    <div class="player-info">
      <div class="player-avatar" aria-label="Player avatar">
        <span class="player-avatar__initials">KN</span>
        <span class="player-avatar__level" aria-label="Player level">42</span>
      </div>

      <div class="player-stats">
        <h1 class="player-stats__name">Knight</h1>

        <div class="player-stats__bars">
          <div class="stat-bar stat-bar--hp" role="meter" aria-label="Health points" aria-valuenow="75"
            aria-valuemin="0" aria-valuemax="100">
            <span class="stat-bar__label">HP</span>
            <div class="stat-bar__track">
              <div class="stat-bar__fill" style="width: 75%"></div>
            </div>
            <span class="stat-bar__value">75 / 100</span>
          </div>

          <div class="stat-bar stat-bar--mana" role="meter" aria-label="Mana points" aria-valuenow="60"
            aria-valuemin="0" aria-valuemax="100">
            <span class="stat-bar__label">MP</span>
            <div class="stat-bar__track">
              <div class="stat-bar__fill" style="width: 60%"></div>
            </div>
            <span class="stat-bar__value">60 / 100</span>
          </div>
        </div>
      </div>
    </div>

    <nav class="main-nav" aria-label="Main navigation">
      <ul class="main-nav__list">
        <li class="main-nav__item">
          <a href="index.html" class="main-nav__link main-nav__link--active" aria-current="page">
            Inventory
          </a>
        </li>
        <li class="main-nav__item">
          <a href="stats.html" class="main-nav__link">
            Stats
          </a>
        </li>
      </ul>
    </nav>

  </header>

  <!-- =============================================
         MAIN — Two-column layout: Item Pool + Inventory Grid
         ============================================= -->
  <main class="site-main">

    <!-- LEFT COLUMN: Available items to drag from -->
    <section class="item-pool" aria-labelledby="item-pool-heading" role="grid" ondragover="ablegenErlauben(event)"
      ondrop="ablegen(event)">

      <div class="panel-header">
        <h2 class="panel-header__title" id="item-pool-heading">Item Pool</h2>
        <div class="panel-header__controls">
          <label for="item-filter" class="sr-only">Filter items by type</label>
          <select id="item-filter" class="filter-select" aria-label="Filter items by type">
            <option value="all">All Types</option>
            <option value="material">Materials</option>
            <option value="consumable">Consumables</option>
            <option value="weapon">Weapons</option>
            <option value="food">Food</option>
          </select>
        </div>
      </div>

      <!-- Items are injected here by data.js + inventory.js -->
      <ul class="item-pool__grid" id="item-pool-grid" aria-label="Available items">
        <!-- Dynamic content — rendered by JavaScript -->
      </ul>

    </section>

    <!-- RIGHT COLUMN: Inventory grid with draggable slots -->
    <section class="inventory" aria-labelledby="inventory-heading" role="grid" ondragover="ablegenErlauben(event)"
      ondrop="ablegen(event)">

      <div class="panel-header">
        <h2 class="panel-header__title" id="inventory-heading">Inventory</h2>
        <p class="panel-header__counter">
          <span id="slot-used-count">0</span> / <span id="slot-total-count">30</span> Slots
        </p>
      </div>

      <!-- Slots are injected here by inventory.js -->
      <div class="inventory__grid" id="inventory-grid" aria-label="Inventory slots" role="grid">
        <!-- Dynamic content — rendered by JavaScript -->
      </div>

      <!-- Item detail panel — shown on click/hover of an inventory item -->
      <aside class="item-detail" id="item-detail" aria-live="polite" aria-label="Item details" hidden>
        <div class="item-detail__icon-wrapper">
          <span class="item-detail__icon" id="item-detail-icon" aria-hidden="true"></span>
        </div>
        <div class="item-detail__info">
          <h3 class="item-detail__name" id="item-detail-name"></h3>
          <p class="item-detail__type" id="item-detail-type"></p>
          <p class="item-detail__rarity" id="item-detail-rarity"></p>
          <p class="item-detail__description" id="item-detail-description"></p>
        </div>
        <button class="item-detail__close" id="item-detail-close" aria-label="Close item details">
          ✕
        </button>
      </aside>

    </section>

  </main>

  <!-- =============================================
         FOOTER
         ============================================= -->
  <footer class="site-footer">
    <p class="site-footer__text">
      Game Inventory &mdash; Web Technology Project &copy; 2025
    </p>
  </footer>

  <!-- Scripts — loaded at end of body for performance -->
  <script src="js/data.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/dragdrop.js"></script>

</body>

</html>
